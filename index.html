<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/eat.png">
    <title>i_love_studying</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>





<div class="container">



  <div class="content">


    <img src="com.png" id="com" alt="Logo">
    <p id="des">A (very unserious) study platform dedicated to your favorite concepts. <br>
    For the intellectually curious people that  hate studying... </p>



<form id="register-form">
  <label for="first-name">First name</label>
  <input id="first-name" type="text" placeholder="Type..." required>

  <label for="last-name">Last name</label>
  <input id="last-name" type="text" placeholder="Type..." required>

  <label for="course"> Available Courses</label>
  <select id="course" required>
    <option value="" disabled selected>Choose a course...</option>
    <option>The Discourse of Arts and Sciences (1751)</option>
    <option>Courtesans and Fishcakes (1997)</option>
    <option>Meditations (c. 180 AD)</option>
  </select>

  <button type="submit">ENTER »</button>
</form>





    <p class="legal">
      By pressing enter, you agree to let the platform
      <u>save your name</u> and <u>study progress</u><br>
      (ONLY until you close this tab, VERY low commitement:)
    </p>


    <img src="sleep.png" id="sleep" alt="ponder">
<img id="popup" src="pro.png" alt="Popup">






  </div>
</div>




























<script src="script.js"></script>





</body>
</html>
